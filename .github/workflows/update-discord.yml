name: Update Discord Member Count

on:
  schedule:
    - cron: '*/30 * * * *' # Automatically runs every 30 minutes
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  update-discord-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stats from Discord API
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bot $BOT_TOKEN" \
            "https://discord.com/api/v10/guilds/$GUILD_ID?with_counts=true")

          TOTAL=$(echo "$RESPONSE" | jq '.approximate_member_count // 0')
          ONLINE=$(echo "$RESPONSE" | jq '.approximate_presence_count // 0')

          echo "{\"total_members\": $TOTAL, \"online_members\": $ONLINE}" > discord.json

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add discord.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update discord member count" && git push)
